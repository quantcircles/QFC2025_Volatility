name: Daily Summary Report

# Run automatically on Indian market weekdays and allow manual runs from GitHub.
on:
  schedule:
    # 12:30 UTC = 18:00 IST, after the regular NSE cash-market close.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

# Needed so the workflow can commit generated files back to the repository.
permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    env:
      # Keep Python date handling aligned with the Indian market calendar.
      TZ: Asia/Kolkata
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download NSE previous-close files
        run: |
          # Writes the latest available NIFTY 50 close, constituent snapshot,
          # official NIFTY 50 index close, FRED India macro economy score, financial results, shareholding
          # pattern, fundamental score files, technical score files, and
          # daily strategy backtests with rebalance holdings and dashboard HTML.
          python portfolioAnalysis_SM.py --previous-close --fallback-days 14 --index-history --economy-history --fundamentals --fundamentals-source auto --fundamental-scores --fundamental-score-history --technical-scores --backtests --dashboard-html

      - name: Generate daily summary
        run: |
          # The agent writes dated reports under reports/ and updates the latest summary.
          python - <<'PY'
          from datetime import date
          from agents.daily_summary_mcp_agent import _generate_daily_summary
          print(_generate_daily_summary(date.today()))
          PY

      - name: Commit and push generated files
        run: |
          # Commit only when report generation or NSE downloads changed files.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git add data_cache/nse_equity/
          git add dashboards/
          git add fundamental_score_dashboard.html
          git diff --cached --quiet || git commit -m "chore: daily summary and nse files"
          git push
